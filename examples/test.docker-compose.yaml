services:
  postgres-salon-test:
    image: postgres:18
    container_name: postgres-salon-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon
    ports:
      - "5460:5432"
    volumes:
      - postgres_data_salon_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-salon-test:
    image: redis:7-alpine
    container_name: redis-salon-test
    restart: unless-stopped
    ports:
      - "6400:6379"
    volumes:
      - redis_data_test:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: salonBackendTest
    env_file:
      - .env
    depends_on:
      postgres-salon-test:
        condition: service_healthy
    ports:
      - "8101:8000"
    volumes:
      - ./src:/app/src
      - app_secrets_test:/app/secrets

  celery-worker-test:
    build: .
    container_name: salonCeleryWorkerTest
    env_file:
      - .env
    depends_on:
      postgres-salon-test:
        condition: service_healthy
      redis-salon-test:
        condition: service_started
    command: >
      uv run celery -A src.core.celery.celeryApp.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src

  celery-beat-test:
    build: .
    container_name: salonCeleryBeatTest
    env_file:
      - .env
    depends_on:
      postgres-salon-test:
        condition: service_healthy
      redis-salon-test:
        condition: service_started
    command: >
      uv run celery -A src.core.celery.celeryApp.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src

volumes:
  postgres_data_salon_test:
  redis_data_test:
  app_secrets_test:
