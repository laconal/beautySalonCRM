services:
  postgres-salon:
    image: postgres:18
    container_name: postgres-salon
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon
    ports:
      - "5451:5432"
    volumes:
      - postgres_data_salon:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-salon:
    image: redis:7-alpine
    container_name: redis-salon
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: salonBackend
    env_file:
      - .env
    depends_on:
      postgres-salon:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - app_secrets:/app/secrets

  celery-worker:
    build: .
    container_name: salonCeleryWorker
    env_file:
      - .env
    depends_on:
      postgres-salon:
        condition: service_healthy
      redis-salon:
        condition: service_started
    command: >
      uv run celery -A src.core.celery.celeryApp.celery_app worker --loglevel=info
    volumes:
      - ./src:/app/src

  celery-beat:
    build: .
    container_name: salonCeleryBeat
    env_file:
      - .env
    depends_on:
      postgres-salon:
        condition: service_healthy
      redis-salon:
        condition: service_started
    command: >
      uv run celery -A src.core.celery.celeryApp.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src

volumes:
  postgres_data_salon:
  redis_data:
  app_secrets:
